packages:
  - apps/*
  - packages/*

# Required local postinstall scripts: Prisma downloads its engine/client and tsx uses esbuild.
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - msgpackr-extract
  - prisma

# Allows non-interactive development/CI commands to recreate generated node_modules.
confirmModulesPurge: false
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
